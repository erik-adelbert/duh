<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    #terminal {
      width: 84ch;
      height: 56em;
    }
  </style>

  <script src="wasm_exec.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.js"></script>
</head>

<body>
  <div id="terminal"></div>

  <script>
    const SAMPLE_RATE = 48000;

    let audioContext = null;
    let audioNode = null;
    let audioReady = null;
    let bankNames = null;
    let playbackStartTime = 0;

    const post = message => parent.postMessage(message, "*");

    function reportError(message) {
      console.error(message);
      post({ type: "error", message: String(message) });
    }

    /**
     * Resume the AudioContext. Called (a) right after creation and (b) from a
     * one-shot user gesture inside this frame if the context is still
     * suspended — the parent's click is not always considered a gesture by
     * the autoplay policy.
     */
    async function unlockAudio() {
      if (!audioContext) return false;
      if (audioContext.state === "running") return true;
      try {
        await audioContext.resume();
      } catch (err) {
        console.warn("resume() failed", err);
      }
      return audioContext.state === "running";
    }

    function installGestureUnlock() {
      if (!audioContext || audioContext.state === "running") return;
      const handler = async () => {
        const ok = await unlockAudio();
        if (ok) {
          document.removeEventListener("pointerdown", handler, true);
          document.removeEventListener("keydown", handler, true);
          post({ type: "audio-unlocked" });
        }
      };
      document.addEventListener("pointerdown", handler, true);
      document.addEventListener("keydown", handler, true);
    }

    async function initAudio() {
      if (audioReady) return audioReady;

      audioReady = (async () => {
        // iOS mutes Web Audio while the ringer switch is silent unless the session is "playback".
        if (navigator.audioSession) navigator.audioSession.type = "playback";

        audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });

        await audioContext.audioWorklet.addModule("pcm-worklet.js");

        audioNode = new AudioWorkletNode(audioContext, "mid-pcm-player", {
          numberOfInputs: 0,
          numberOfOutputs: 1,
          outputChannelCount: [2]
        });

        audioNode.connect(audioContext.destination);

        const ok = await unlockAudio();
        if (!ok) {
          // Autoplay is blocked; fall back to a gesture inside the iframe.
          // We still return a usable node so WASM can start rendering.
          installGestureUnlock();
          post({ type: "audio-blocked" });
        }
      })();

      return audioReady;
    }

    globalThis.testAudio = async () => {
      await initAudio();

      await audioContext.resume();

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.frequency.value = 440;
      gain.gain.value = 0.1;

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 2);
    };

    globalThis.populateBanks = names => {
      bankNames = names;
      post({ type: "banks", names });
    };

    globalThis.writeAudio = bytes => {
      if (!audioNode) return;
      audioNode.port.postMessage(bytes, [bytes.buffer]);
    };

    globalThis.playbackTime = () => {
      if (!audioContext) return 0;
      return Math.max(0, audioContext.currentTime - playbackStartTime);
    };

    const term = new Terminal({
      cols: 84,
      rows: 50,
      cursorBlink: false,
      convertEol: true,
      scrollback: 0,
      fontFamily: '"JetBrains Mono", "DejaVu Sans Mono", monospace',
      fontSize: 13,
      lineHeight: 1.1
    });

    term.open(document.getElementById("terminal"));

    try {
      term.loadAddon(new WebglAddon.WebglAddon());
    } catch {
      // fall back to canvas/DOM renderer
    }

    globalThis.renderScreen = screen => term.write(screen);

    globalThis.renderError = error => {
      console.error(error);
      term.write(`\r\n\x1b[31m${error}\x1b[0m\r\n`);
    };

    globalThis.playbackStarted = () => {
      playbackStartTime = audioContext.currentTime;
      post({ type: "playback-started" });
    };

    globalThis.playbackEnded = () => {
      post({ type: "playback-ended" });
    };

    window.addEventListener("message", async event => {
      const data = event.data;
      if (!data || typeof data !== "object") return;

      if (data.type === "request-banks") {
        if (bankNames) post({ type: "banks", names: bankNames });
        return;
      }

      if (data.type === "render-error") {
        renderError(String(data.message ?? "unknown error"));
        return;
      }

      if (data.type !== "play") return;

      try {
        const { src: pendingFile, bank } = data;

        document.title = pendingFile.name || "duh midweb";

        await initAudio();

        console.log({
          state: audioContext.state,
          sampleRate: audioContext.sampleRate,
          baseLatency: audioContext.baseLatency,
          outputLatency: audioContext.outputLatency,
        });

        audioContext.addEventListener("statechange", () => {
          console.log("AudioContext state:", audioContext.state);
        });

        term.clear();
        term.write("\x1b[2J\x1b[H");

        if (!pendingFile?.data) {
          throw new Error("No MIDI data received.");
        }
        if (pendingFile.data.byteLength === 0) {
          throw new Error("Empty MIDI file.");
        }

        const bytes = new Uint8Array(pendingFile.data);
        const result = globalThis.run(bytes, bank);
        if (result) renderError(result);
      } catch (error) {
        reportError(error?.message ?? error);
        renderError(error?.stack ?? String(error));
        // Make sure the parent UI unsticks.
        globalThis.playbackEnded();
      }
    });

    window.addEventListener("unload", () => {
      try { audioNode?.disconnect(); } catch { /* ignore */ }
      try { audioContext?.close(); } catch { /* ignore */ }
    });

    const go = new Go();

    WebAssembly.instantiateStreaming(
      fetch("midweb.wasm"),
      go.importObject
    )
      .then(({ instance }) => go.run(instance))
      .catch(error => {
        renderError(`Failed to load WASM:\r\n${error}`);
        reportError(`Failed to load WASM: ${error}`);
      });
  </script>
</body>
</html>
