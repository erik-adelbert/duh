<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    #terminal {
      width: 84ch;
      height: 56em;
    }
  </style>

  <script src="wasm_exec.js"></script>
  <script src="pcm-buffer-pool.js?v=audio-pool-2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.js"></script>
  <script src="playback-terminal.js?v=1"></script>
</head>

<body>
  <div id="terminal"></div>

  <script>
    const SAMPLE_RATE = 48000;

    let audioContext = null;
    let audioNode = null;
    let audioReady = null;
    let bankNames = null;
    let playbackStartTime = 0;
    let paused = false;
    let stopped = false;
    let active = false;
    let audioBlocked = false;
    let gestureUnlock = null;
    // Keep the buffer size in sync with audioChunkBytes in cmd/midweb/play.go.
    const audioBuffers = new PCMBufferPool(4 * 1024, 8);

    const post = message => parent.postMessage(message, "*");

    /**
     * Resume the AudioContext. Called (a) right after creation and (b) from a
     * one-shot user gesture inside this frame if the context is still
     * suspended — the parent's click is not always considered a gesture by
     * the autoplay policy.
     */
    async function unlockAudio() {
      if (!audioContext) return false;
      if (audioContext.state === "running") return true;
      try {
        await audioContext.resume();
      } catch (err) {
        console.warn("resume() failed", err);
      }
      return audioContext.state === "running";
    }

    function installGestureUnlock() {
      if (!audioContext || audioContext.state === "running" || paused || gestureUnlock) return;
      gestureUnlock = async () => {
        if (paused) return;
        const ok = await unlockAudio();
        if (ok && !paused) {
          setAudioUnlocked();
        }
      };
      document.addEventListener("pointerdown", gestureUnlock, true);
      document.addEventListener("keydown", gestureUnlock, true);
    }

    function removeGestureUnlock() {
      if (!gestureUnlock) return;
      document.removeEventListener("pointerdown", gestureUnlock, true);
      document.removeEventListener("keydown", gestureUnlock, true);
      gestureUnlock = null;
    }

    function setAudioBlocked() {
      if (!audioBlocked) {
        audioBlocked = true;
        post({ type: "audio-blocked" });
      }
      installGestureUnlock();
    }

    function setAudioUnlocked() {
      removeGestureUnlock();
      if (audioBlocked) {
        audioBlocked = false;
        post({ type: "audio-unlocked" });
      }
    }

    async function initAudio() {
      if (!audioReady) audioReady = (async () => {
        // iOS mutes Web Audio while the ringer switch is silent unless the session is "playback".
        if (navigator.audioSession) navigator.audioSession.type = "playback";

        audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
        audioContext.addEventListener("statechange", () => {
          if (!active) return;
          if ((audioContext.state === "suspended" || audioContext.state === "interrupted") && !paused) {
            setAudioBlocked();
          } else if (audioContext.state === "running") {
            setAudioUnlocked();
          }
        });

        await audioContext.audioWorklet.addModule("pcm-worklet.js?v=audio-pool-2");

      })();
      await audioReady;
      if (!audioNode) {
        audioNode = new AudioWorkletNode(audioContext, "mid-pcm-player", {
          numberOfInputs: 0,
          numberOfOutputs: 1,
          outputChannelCount: [2]
        });
        audioNode.port.onmessage = event => audioBuffers.recycle(event.data);
        audioNode.connect(audioContext.destination);
      }
    }

    globalThis.testAudio = async () => {
      await initAudio();

      await audioContext.resume();

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.frequency.value = 440;
      gain.gain.value = 0.1;

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 2);
    };

    globalThis.populateBanks = names => {
      bankNames = names;
      post({ type: "banks", names });
    };

    globalThis.acquireAudioBuffer = length => audioBuffers.acquire(length);

    globalThis.writeAudio = bytes => {
      if (!audioNode) return;
      audioNode.port.postMessage(bytes, [bytes.buffer]);
    };

    globalThis.playbackTime = () => {
      if (!audioContext) return 0;
      return Math.max(0, audioContext.currentTime - playbackStartTime);
    };

    globalThis.playbackPaused = () => paused || (!!audioContext && audioContext.state !== "running");
    globalThis.playbackStopped = () => stopped;

    globalThis.stopPlayback = () => {
      stopped = true;
      active = false;
      paused = false;
      audioBlocked = false;
      removeGestureUnlock();
      if (audioNode) {
        audioNode.disconnect();
        audioNode = null;
      }
    };

    globalThis.pausePlayback = async () => {
      paused = true;
      removeGestureUnlock();
      try {
        await audioContext.suspend();
      } catch (error) {
        paused = false;
        if (audioContext.state !== "running") installGestureUnlock();
        throw error;
      }
    };

    globalThis.resumePlayback = async () => {
      if (!paused) return;
      if (!(await unlockAudio())) {
        throw new Error("Audio could not be resumed. Try again.");
      }
      paused = false;
      setAudioUnlocked();
    };

    const term = new Terminal({
      cols: 84,
      rows: 50,
      cursorBlink: false,
      convertEol: true,
      scrollback: 0,
      fontFamily: '"JetBrains Mono", "DejaVu Sans Mono", monospace',
      fontSize: 13,
      lineHeight: 1.1
    });

    term.open(document.getElementById("terminal"));

    const playbackTerminal = new PlaybackTerminal(term);
    let playbackFailed = false;
    playbackTerminal.start();

    globalThis.renderScreen = screen => term.write(screen);

    globalThis.renderError = error => {
      playbackFailed = true;
      console.error(error);
      term.write(`\r\n\x1b[31m${error}\x1b[0m\r\n`);
      post({ type: "error", message: String(error) });
    };

    globalThis.playbackStarted = () => {
      playbackStartTime = audioContext.currentTime;
      post({ type: "playback-started" });
    };

    globalThis.playbackEnded = () => {
      paused = false;
      active = false;
      audioBlocked = false;
      removeGestureUnlock();
      playbackTerminal.finish(!playbackFailed);
      post({ type: "playback-ended" });
    };

    window.addEventListener("message", async event => {
      if (event.source !== parent) return;
      const data = event.data;
      if (!data || typeof data !== "object") return;

      if (data.type === "request-banks") {
        if (bankNames) post({ type: "banks", names: bankNames });
        return;
      }

      if (data.type === "render-error") {
        renderError(String(data.message ?? "unknown error"));
        return;
      }

      if (data.type !== "play") return;

      playbackFailed = false;
      stopped = false;
      active = true;
      playbackTerminal.start();
      try {
        const { src: pendingFile, bank } = data;

        document.title = pendingFile.name || "duh midweb";

        await initAudio();
        if (audioContext.state !== "running" && !(await unlockAudio())) {
          setAudioBlocked();
        }

        console.log({
          state: audioContext.state,
          sampleRate: audioContext.sampleRate,
          baseLatency: audioContext.baseLatency,
          outputLatency: audioContext.outputLatency,
        });

        term.clear();
        term.write("\x1b[2J\x1b[H");

        if (!pendingFile?.data) {
          throw new Error("No MIDI data received.");
        }
        if (pendingFile.data.byteLength === 0) {
          throw new Error("Empty MIDI file.");
        }

        const bytes = new Uint8Array(pendingFile.data);
        const result = globalThis.run(bytes, bank);
        if (result) renderError(result);
      } catch (error) {
        renderError(error?.stack ?? String(error));
        // Make sure the parent UI unsticks.
        globalThis.playbackEnded();
      }
    });

    window.addEventListener("unload", () => {
      try { audioNode?.disconnect(); } catch { /* ignore */ }
      try { audioContext?.close(); } catch { /* ignore */ }
    });

    const go = new Go();

    WebAssembly.instantiateStreaming(
      fetch("midweb.wasm?v=stop-1"),
      go.importObject
    )
      .then(({ instance }) => go.run(instance))
      .catch(error => {
        renderError(`Failed to load WASM:\r\n${error}`);
      });
  </script>
</body>
</html>
