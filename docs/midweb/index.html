<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#000000">
  <title>duh midweb</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: monospace;
      color: #ddd;
    }

    #controls {
      margin: 30px;
    }

    #buttons {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #midi-file {
      display: none; /* ensure hidden input doesn't affect flex layout */
    }

    /* Everything in the row shares one box model, font, and height. */
    #buttons > * {
      box-sizing: border-box;
      font: inherit;
      height: 28px;
      line-height: 26px;
    }

    #bank-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    #bank {
      width: 28ch;
      max-width: 50vw;
      padding: 0 6px;
      border: 1px solid #555;
      border-radius: 3px;
      background: #111;
      color: #ddd;
    }

    button {
      padding: 0 12px;
      border: 1px solid #555;
      border-radius: 3px;
      background: #222;
      color: #ddd;
      cursor: pointer;
    }

    button:disabled, select:disabled { opacity: .45; cursor: default; }

    #info {
      margin-top: 6px;
      color: #ccc;
      white-space: pre-line;
    }

    /*
     * The iframe hosts an xterm of 84 cols x 50 rows at fontSize 13px and
     * lineHeight 1.1, i.e. roughly 56em tall in its own document. Using
     * em here (monospace, so 1em ≈ 13px) keeps the two in sync without
     * a resize handshake.
     */
    #terminal-frame {
      display: block;
      margin: 10px;
      width: 84ch;
      height: calc(50 * 13px * 1.1); /* 715px — matches xterm 50 rows */
      border: 0;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div id="buttons">
      <input id="midi-file" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
      <button id="choose" type="button">Choose MIDI</button>
      <label id="bank-control" for="bank">Bank
        <select id="bank" disabled></select>
      </label>
      <button id="play" type="button" disabled>Play</button>
    </div>
    <div id="info">
        <span id="status">Choose a MIDI file and instrument bank.</span><br>
        <span id="file-name">No file selected</span><span> / PCM 48.000 kHz stereo</span>
    </div>
  </div>

  <iframe
    id="terminal-frame"
    src="mid.html"
    title="MIDI player"
    allow="autoplay">
  </iframe>

  <script>
    const SOURCE_RATE = 48000;
    const MAX_FILE_SIZE = 10 * 1024 * 1024;

    const terminal = document.getElementById("terminal-frame");
    const fileInput = document.getElementById("midi-file");
    const chooseButton = document.getElementById("choose");
    const bankSelect = document.getElementById("bank");
    const playButton = document.getElementById("play");
    const status = document.getElementById("status");
    const fileName = document.getElementById("file-name");

    let selectedFile = null;
    let wasmReady = false;
    let playing = false;

    function updateReady() {
      const ready = wasmReady && selectedFile !== null && !playing;
      playButton.disabled = !ready;
      bankSelect.disabled = !wasmReady || playing;
      fileInput.disabled = playing;
      chooseButton.disabled = playing;
    }

    function setStatus(text, state) {
      status.textContent = text;
      status.dataset.state = state;
    }

    function requestBanks() {
      // Ask the iframe for bank names; it replies via populateBanks below.
      try {
        terminal.contentWindow?.postMessage({ type: "request-banks" }, "*");
      } catch { /* iframe may not be ready yet; load handler retries */ }
    }

    // The iframe may have WASM ready before we ever load — populateBanks is
    // the primary path. request-banks is a fallback in case we attach late.
    globalThis.populateBanks = names => {
      bankSelect.replaceChildren();
      names.forEach((name, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = `${String(index).padStart(2, "0")} · ${name}`;
        bankSelect.append(option);
      });
      if (names.length > 79) bankSelect.value = "79";
      wasmReady = true;
      setStatus(selectedFile ? "Ready" : "Choose a file", "ready");
      updateReady();
    };

    window.addEventListener("message", event => {
      const data = event.data;
      if (!data || typeof data !== "object") return;

      if (data.type === "playback-ended") {
        globalThis.playbackEnded();
      } else if (data.type === "banks") {
        globalThis.populateBanks(data.names);
      } else if (data.type === "playback-started") {
        setStatus("Playing", "playing");
      } else if (data.type === "audio-blocked") {
        setStatus("Tap the terminal to enable sound", "error");
      } else if (data.type === "audio-unlocked") {
        setStatus("Playing", "playing");
      } else if (data.type === "error") {
        // If the iframe reports an init error (e.g. autoplay blocked),
        // unstick the UI so the user can retry.
        renderError(String(data.message ?? "unknown error"));
        globalThis.playbackEnded();
      }
    });

    globalThis.playbackEnded = () => {
      playing = false;
      if (wasmReady) setStatus(selectedFile ? "Ready" : "Choose a file", "ready");
      updateReady();
    };

    globalThis.renderError = message => {
      setStatus(message, "error");
      console.error(message);
      // Best-effort: also surface it in the iframe terminal.
      try {
        terminal.contentWindow?.postMessage({ type: "render-error", message }, "*");
      } catch { /* ignore */ }
    };

    terminal.addEventListener("load", () => {
      // Re-request banks in case the iframe was reloaded after WASM init.
      wasmReady = false;
      updateReady();
      requestBanks();
    });

    fileInput.addEventListener("change", () => {
      selectedFile = fileInput.files?.[0] ?? null;
      fileName.textContent = selectedFile ? selectedFile.name : "No file selected";
      setStatus(selectedFile ? "File loaded" : "Choose a file", selectedFile ? "ready" : "loading");
      updateReady();
    });

    chooseButton.addEventListener("click", () => {
      fileInput.click();
    });

    // Re-enable the choose button if the picker is cancelled.
    fileInput.addEventListener("cancel", () => {
      if (!playing) chooseButton.disabled = false;
    });

    playButton.addEventListener("click", async () => {
      if (!selectedFile || !wasmReady || playing) return;

      if (selectedFile.size > MAX_FILE_SIZE) {
        renderError("MIDI files must be 10 MiB or smaller.");
        return;
      }

      // Read the file *before* flipping UI state, so a read error doesn't
      // leave us stuck in "playing".
      let buffer;
      try {
        buffer = await selectedFile.arrayBuffer();
      } catch (err) {
        renderError(`Could not read file: ${err}`);
        return;
      }

      const pendingFile = { name: selectedFile.name, data: buffer };
      const bankNumber = Number(bankSelect.value);

      playing = true;
      setStatus("Synthesizing", "playing");
      updateReady();

      try {
        terminal.contentWindow.postMessage(
          { type: "play", src: pendingFile, bank: bankNumber },
          "*",
          [buffer] // transfer; if this throws, buffer is still valid here
        );
      } catch (err) {
        playing = false;
        setStatus("Ready", "ready");
        updateReady();
        renderError(`Could not start playback: ${err}`);
      }
    });
  </script>
</body>
</html>
