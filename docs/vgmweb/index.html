<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
  <title>duh vgmweb</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <script src="screen-wake-lock.js?v=1"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: monospace;
      color: #ddd;
    }

    #controls {
      margin: 30px;
    }

    #buttons {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Everything in the row shares one box model, font, and height. */
    #buttons > * {
      box-sizing: border-box;
      font: inherit;
      height: 28px;
    }

    button {
      padding: 0 12px;
      border: 1px solid #555;
      border-radius: 3px;
      background: #222;
      color: #ddd;
      cursor: pointer;
    }

    button:disabled { opacity: .45; cursor: default; }

    #info {
      margin-top: 6px;
      color: #ccc;
      white-space: pre-line;
    }

    #terminal-frame {
      margin: 10px;
      width: 84ch;
      height: calc(72 * 20px);
      border: 0;
    }
  </style>
</head>

<body>
  <div id="controls">
    <div id="buttons">
      <input id="file" type="file" accept=".vgm,.vgz" hidden>
      <button id="choose">Choose VGM</button>
      <button id="play" disabled>Play</button>
      <button id="stop" disabled>Stop</button>
      <button id="pause" disabled>Pause</button>
    </div>
    <div id="wake-lock-status" role="status"></div>

    <div id="info">
      <span id="status" role="status">Loading player...</span><br>
      <span id="file-name">No file selected</span><span> / PCM 44.100 kHz stereo</span><br>
      Grab an OPL3 file from OPL Archive. Please don't hammer the site.
    </div>
  </div>

  <iframe
    id="terminal-frame"
    src="vgm.html?v=stop-1"
    title="VGM player"
    allow="autoplay">
  </iframe>

  <script>
    const terminal = document.getElementById("terminal-frame");
    const fileInput = document.getElementById("file");
    const chooseButton = document.getElementById("choose");
    const playButton = document.getElementById("play");
    const stopButton = document.getElementById("stop");
    const pauseButton = document.getElementById("pause");
    const status = document.getElementById("status");
    const fileName = document.getElementById("file-name");
    const wakeLockStatus = document.getElementById("wake-lock-status");
    const maxFileSize = 50 * 1024 * 1024;

    let selectedFile = null;
    let wasmReady = false;
    let playbackError = false;
    let audioBlocked = false;
    let playing = false;
    let started = false;
    let paused = false;
    let controlPending = false;
    let stopping = false;
    const playbackWakeLock = new PlaybackWakeLock(
      navigator.wakeLock,
      () => document.visibilityState === "visible",
      message => { wakeLockStatus.textContent = message; }
    );
    document.addEventListener("visibilitychange", () => playbackWakeLock.visibilityChanged());
    window.addEventListener("pagehide", () => playbackWakeLock.stop());
    window.addEventListener("pageshow", event => {
      if (event.persisted && playing && started && !paused && !audioBlocked) playbackWakeLock.start();
    });

    function updateControls() {
      playButton.disabled = !wasmReady || !selectedFile || playing || controlPending;
      chooseButton.disabled = playing || controlPending;
      fileInput.disabled = playing || controlPending;
      pauseButton.disabled = !playing || !started || controlPending;
      stopButton.disabled = !playing || !started || controlPending;
    }

    function requestReady() {
      terminal.contentWindow.postMessage({ type: "request-ready" }, "*");
    }

    terminal.addEventListener("load", () => {
      wasmReady = false;
      updateControls();
      requestReady();
    });
    requestReady();

    window.addEventListener("message", event => {
      if (event.source !== terminal.contentWindow) return;
      if (event.data?.type === "terminal-height") {
        const height = event.data.height;
        if (Number.isFinite(height) && height > 0) terminal.style.height = `${Math.ceil(height)}px`;
      } else if (event.data?.type === "player-ready") {
        wasmReady = true;
        if (!playbackError) status.textContent = selectedFile ? "Ready." : "Choose a file.";
        updateControls();
      } else if (event.data?.type === "playback-ended") {
        playing = false;
        started = false;
        paused = false;
        audioBlocked = false;
        controlPending = false;
        pauseButton.textContent = "Pause";
        playbackWakeLock.stop();
        if (!playbackError) status.textContent = stopping ? "Stopped." : "Playback finished.";
        stopping = false;
        updateControls();
      } else if (event.data?.type === "playback-started") {
        started = true;
        updateControls();
        if (!audioBlocked) {
          playbackWakeLock.start();
          status.textContent = "Playing.";
        }
      } else if (event.data?.type === "audio-blocked") {
        if (!playing || stopping) return;
        audioBlocked = true;
        playbackWakeLock.stop();
        status.textContent = "Tap the player to enable sound.";
      } else if (event.data?.type === "audio-unlocked") {
        if (!playing || stopping) return;
        audioBlocked = false;
        if (playing && started && !paused) {
          playbackWakeLock.start();
          status.textContent = "Playing.";
        }
      } else if (event.data?.type === "error") {
        playbackError = true;
        status.textContent = String(event.data.message ?? "unknown error");
      }
    });

    chooseButton.onclick = () => fileInput.click();

    fileInput.onchange = () => {
      selectedFile = fileInput.files[0] ?? null;
      fileName.textContent = selectedFile ? selectedFile.name : "No file selected";
      playbackError = false;
      status.textContent = selectedFile ? "Ready." : "Choose a file.";
      updateControls();
    };

    playButton.onclick = async () => {
      if (!wasmReady || !selectedFile || playing || controlPending) return;
      if (!selectedFile.size || selectedFile.size > maxFileSize) {
        status.textContent = "VGM files must be between 1 byte and 50 MiB.";
        return;
      }

      playbackError = false;
      controlPending = true;
      status.textContent = "Loading file...";
      updateControls();
      let buffer;
      try {
        buffer = await selectedFile.arrayBuffer();
      } catch (error) {
        controlPending = false;
        status.textContent = `Could not read file: ${error.message || String(error)}`;
        updateControls();
        return;
      }

      playing = true;
      controlPending = false;
      status.textContent = "Starting playback...";
      updateControls();
      try {
        terminal.contentWindow.postMessage({
          type: "play",
          data: buffer,
          name: selectedFile.name
        }, "*", [buffer]);
      } catch (error) {
        playing = false;
        playbackWakeLock.stop();
        status.textContent = `Could not start playback: ${error.message || String(error)}`;
        updateControls();
        return;
      }
    };

    stopButton.onclick = () => {
      if (!playing || !started || controlPending) return;
      controlPending = true;
      stopping = true;
      updateControls();
      try {
        terminal.contentWindow.stopPlayback();
        status.textContent = "Stopping...";
      } catch (error) {
        controlPending = false;
        stopping = false;
        status.textContent = `Could not stop: ${error.message || String(error)}`;
        updateControls();
      }
    };

    pauseButton.onclick = async () => {
      if (!playing || !started || controlPending) return;
      controlPending = true;
      updateControls();
      try {
        if (paused) {
          await terminal.contentWindow.resumePlayback();
          if (!playing) return;
          paused = false;
          playbackWakeLock.start();
          pauseButton.textContent = "Pause";
          status.textContent = "Playing.";
        } else {
          await terminal.contentWindow.pausePlayback();
          if (!playing) return;
          paused = true;
          playbackWakeLock.stop();
          pauseButton.textContent = "Resume";
          status.textContent = "Paused.";
        }
      } catch (error) {
        if (playing) status.textContent = `Could not ${paused ? "resume" : "pause"}: ${error.message || String(error)}`;
      } finally {
        controlPending = false;
        updateControls();
      }
    };
  </script>
</body>
</html>
