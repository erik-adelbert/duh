<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>duh vgmweb</title>

  <style>
    html, body {
      margin: 0;
      background: #000;
      font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace;
    }

    #buttons {
      display: flex;
      align-items: center;
    }

    #controls {
      margin: 30px;
    }

    #controls button {
      margin-left: 2px;
      margin-right: 10px;
      padding: 4px 12px;
    }

    #controls button:disabled {
      opacity: 0.45;
    }

    #terminal-frame {
      display: block;
      margin: 10px;
      width: 84ch;
      height: 54em;
      border: 0;
    }
  </style>
</head>

<body>
  <div id="controls">
    <div id="buttons">
      <input id="file" type="file" accept=".vgm,.vgz" hidden >
      <button id="choose">Choose VGM</button>
      <button id="play" disabled>Play</button>
    </div>

    <div style="margin-top: 6px; color: #ccc;white-space: pre-line;">
      Grab an OPL3 file from OPL Archive.
      Please don't hammer the site.
    </div>
  </div>

  <iframe
    id="terminal-frame"
    src="vgm.html"
    title="VGM player"
    allow="autoplay">
  </iframe>

  <script>
    const frame = document.getElementById("terminal-frame");
    const fileInput = document.getElementById("file");
    const playButton = document.getElementById("play");
    const chooseButton = document.getElementById("choose");

    window.addEventListener("message", event => {
      if (event.data?.type === "playback-ended") {
        chooseButton.disabled = false;
      }
    });

    chooseButton.addEventListener("click", () => {
        fileInput.click();
        chooseButton.disabled = true;
    });

    let pendingData = null;

    fileInput.addEventListener("change", async event => {
      const file = event.target.files[0];

      if (!file) {
        return;
      }

      console.log("FILE:", file.name, file.size);

      pendingData = await file.arrayBuffer();

      playButton.disabled = false;
    });

    playButton.addEventListener("click", () => {
      if (!pendingData) {
        return;
      }

      const data = pendingData;
      pendingData = null;

      frame.contentWindow.postMessage(
        {
          type: "play",
          data: data
        },
        "*"
      );

      chooseButton.disabled = true;
      playButton.disabled = true;
    });
  </script>
</body>

</html>
