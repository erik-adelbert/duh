<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <style>
    html, body {
      margin: 0;
      background: #000;
      font-family: monospace;
    }

    #controls {
      margin: 30px;
    }

    #buttons {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 4px 12px;
    }

    button:disabled {
      opacity: .45;
    }

    #info {
      margin-top: 6px;
      color: #ccc;
      white-space: pre-line;
    }

    #terminal-frame {
      margin: 10px;
      width: 84ch;
      height: 1400px;
      border: 0;
    }
  </style>
</head>

<body>
  <div id="controls">
    <div id="buttons">
      <input id="file" type="file" accept=".vgm,.vgz" hidden>
      <button id="choose">Choose VGM</button>
      <button id="play" disabled>Play</button>
    </div>

    <div id="info">
      Grab an OPL3 file from OPL Archive.
      Please don't hammer the site.
    </div>
  </div>

  <iframe
    id="terminal-frame"
    src="vgm.html"
    title="VGM player"
    allow="autoplay">
  </iframe>

  <script>
    const frame = document.getElementById("terminal-frame");
    const fileInput = document.getElementById("file");
    const chooseButton = document.getElementById("choose");
    const playButton = document.getElementById("play");

    let pendingFile;

    window.addEventListener("message", event => {
      if (event.data?.type === "playback-ended")
        chooseButton.disabled = false;
    });

    chooseButton.onclick = () => {
      fileInput.click();
      chooseButton.disabled = true;
    };

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;

      pendingFile = {
        data: await file.arrayBuffer(),
        name: file.name
      };

      playButton.disabled = false;
    };

    playButton.onclick = () => {
      if (!pendingFile) return;

      frame.contentWindow.postMessage({
        type: "play",
        ...pendingFile
      }, "*");

      pendingFile = null;
      chooseButton.disabled = true;
      playButton.disabled = true;
    };
  </script>
</body>
</html>
