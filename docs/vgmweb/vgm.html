<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    #terminal {
      width: 84ch;
      height: 56em;
    }
  </style>

  <script src="wasm_exec.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.js"></script>
</head>

<body>
  <div id="terminal"></div>

  <script>
    const SAMPLE_RATE = 44100;
    let audioContext = null;
    let audioNode = null;
    let audioReady = null;
    let playbackStartTime = 0;
    let audioBlocked = false;
    let gestureUnlock = null;

    const post = message => parent.postMessage(message, "*");

    async function unlockAudio() {
      if (!audioContext) return false;
      if (audioContext.state === "running") return true;
      try {
        await audioContext.resume();
      } catch (err) {
        console.warn("resume() failed", err);
      }
      return audioContext.state === "running";
    }

    function setAudioBlocked() {
      if (!audioBlocked) {
        audioBlocked = true;
        post({ type: "audio-blocked" });
      }
      installGestureUnlock();
    }

    function setAudioUnlocked() {
      if (gestureUnlock) {
        document.removeEventListener("pointerdown", gestureUnlock, true);
        document.removeEventListener("keydown", gestureUnlock, true);
        gestureUnlock = null;
      }
      if (audioBlocked) {
        audioBlocked = false;
        post({ type: "audio-unlocked" });
      }
    }

    function installGestureUnlock() {
      if (!audioContext || audioContext.state === "running" || gestureUnlock) return;
      gestureUnlock = async () => {
        if (await unlockAudio()) setAudioUnlocked();
      };
      document.addEventListener("pointerdown", gestureUnlock, true);
      document.addEventListener("keydown", gestureUnlock, true);
    }

    async function initAudio() {
      if (audioReady) return audioReady;

      audioReady = (async () => {
        if (navigator.audioSession) navigator.audioSession.type = "playback";

        audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
        audioContext.addEventListener("statechange", () => {
          if (audioContext.state === "suspended") {
            setAudioBlocked();
          } else if (audioContext.state === "running") {
            setAudioUnlocked();
          }
        });

        await audioContext.audioWorklet.addModule("pcm-worklet.js");

        audioNode = new AudioWorkletNode(audioContext, "pcm-player", {
          numberOfInputs: 0,
          numberOfOutputs: 1,
          outputChannelCount: [2]
        });

        audioNode.connect(audioContext.destination);
        if (!(await unlockAudio())) setAudioBlocked();
      })();

      return audioReady;
    }

    globalThis.writeAudio = bytes => {
      if (!audioNode) return;
      audioNode.port.postMessage(bytes, [bytes.buffer]);
    };

    globalThis.playbackTime = () => {
      if (!audioContext) return 0;
      return Math.max(0, audioContext.currentTime - playbackStartTime);
    };

    const term = new Terminal({
      cols: 84,
      rows: 50,
      cursorBlink: false,
      convertEol: true,
      scrollback: 0,
      fontFamily: '"JetBrains Mono", "DejaVu Sans Mono", monospace',
      fontSize: 13,
      lineHeight: 1.1
    });

    term.open(document.getElementById("terminal"));

    try {
      term.loadAddon(new WebglAddon.WebglAddon());
    } catch {
      // do nothing, xterm uses the canvas/DOM engine
    }

    globalThis.renderScreen = screen => term.write(screen);

    globalThis.renderError = error => {
      const message = String(error);
      console.error(message);
      term.write(`\r\n\x1b[31m${message}\x1b[0m\r\n`);
      post({ type: "error", message });
    };

    globalThis.playbackEnded = () => {
      post({ type: "playback-ended" });
    };

    globalThis.playbackStarted = () => {
      playbackStartTime = audioContext.currentTime;
      post({ type: "playback-started" });
    };

    window.addEventListener("message", async event => {
      if (event.data?.type !== "play") return;

      try {
        document.title = event.data.name || "duh vgmweb";

        await initAudio();
        if (audioContext.state !== "running") setAudioBlocked();

        term.clear();
        term.write("\x1b[2J\x1b[H");

        const result = globalThis.run(
          new Uint8Array(event.data.data)
        );

        if (result) renderError(result);
      } catch (error) {
        renderError(error?.message ?? error);
        globalThis.playbackEnded();
      }
    });

    const go = new Go();

    WebAssembly.instantiateStreaming(
      fetch("vgmweb.wasm"),
      go.importObject
    )
      .then(({ instance }) => go.run(instance))
      .catch(error => {
        renderError(`Failed to load WASM:\r\n${error}`);
      });
  </script>
</body>
</html>
