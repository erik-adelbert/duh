<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    #terminal {
      width: 84ch;
      height: 54em;
    }
  </style>

  <script src="wasm_exec.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.js"></script>
</head>

<body>
  <div id="terminal"></div>

  <script>
    const SAMPLE_RATE = 44100;

    let audioContext = null;
    let audioNode = null;
    let audioReady = null;

    async function initAudio() {
      if (audioReady) {
        return audioReady;
      }

      audioReady = (async () => {
        audioContext = new AudioContext({
          sampleRate: SAMPLE_RATE
        });

        await audioContext.audioWorklet.addModule(
          "pcm-worklet.js"
        );

        audioNode = new AudioWorkletNode(
          audioContext,
          "pcm-player",
          {
            numberOfInputs: 0,
            numberOfOutputs: 1,
            outputChannelCount: [2]
          }
        );

        audioNode.connect(audioContext.destination);

        await audioContext.resume();

        console.log(
          "Audio ready:",
          audioContext.sampleRate,
          audioContext.state
        );
      })();

      return audioReady;
    }

    /*
     * Go calls this with raw signed 16-bit little-endian PCM.
     * The Uint8Array is transferred to the AudioWorklet.
     */
    globalThis.writeAudio = function(bytes) {
      if (!audioNode) {
        console.error(
          "writeAudio: audio node is not initialized"
        );
        return;
      }

      audioNode.port.postMessage(
        bytes,
        [bytes.buffer]
      );
    };


    const term = new Terminal({
      cols: 84,
      rows: 50,
      cursorBlink: false,
      convertEol: true,
      scrollback: 0,
      fontFamily: '"JetBrains Mono", "DejaVu Sans Mono", monospace',
      fontSize: 13,
      lineHeight: 1.1
    });

    term.open(
      document.getElementById("terminal")
    );


    try {
      term.loadAddon(
        new WebglAddon.WebglAddon()
      );

      console.log(
        "WebGL acceleration activated successfully."
      );
    } catch (e) {
      console.warn(
        "WebGL addon failed to load, " +
        "falling back to canvas/DOM engine:",
        e
      );
    }

    globalThis.renderScreen = function(screen) {
      term.write(screen);
    };

    globalThis.renderError = function(error) {
      console.error(error);

      term.write(
        "\r\n\x1b[31m" +
        error +
        "\x1b[0m\r\n"
      );
    };

    globalThis.playbackEnded = function() {
      window.parent.postMessage(
        { type: "playback-ended" },
        "*"
      );
    };


    /*
     * Receive a VGM file from index.html.
     */
    window.addEventListener(
      "message",
      async event => {
        if (
          !event.data ||
          event.data.type !== "play"
        ) {
          return;
        }

        try {
          /*
           * Audio must be initialized before Go starts
           * calling writeAudio().
           */
          await initAudio();

          const data =
            new Uint8Array(event.data.data);

          term.clear();
          term.write("\x1b[2J\x1b[H");

          /*
           * globalThis.run is installed by the Go/WASM
           * program.
           */
          const result =
            globalThis.run(data);

          if (result) {
            renderError(result);
          }

        } catch (err) {
          console.error(err);
          renderError(String(err));
        }
      }
    );


    /*
     * Start Go/WASM.
     */
    const go = new Go();

    WebAssembly.instantiateStreaming(
      fetch("vgmweb.wasm"),
      go.importObject
    )
      .then(result => {
        return go.run(result.instance);
      })
      .catch(err => {
        term.write(
          "\r\n" +
          "\x1b[31mFailed to load WASM:\x1b[0m\r\n"
        );

        term.write(String(err));
      });
  </script>
</body>
</html>
