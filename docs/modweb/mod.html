<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    #terminal { width: 84ch; height: 56em; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.js"></script>
  <script src="../midweb/playback-terminal.js?v=1"></script>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const term = new Terminal({
      cols: 84, rows: 50, cursorBlink: false, convertEol: true, scrollback: 0,
      fontFamily: '"JetBrains Mono", "DejaVu Sans Mono", monospace', fontSize: 13, lineHeight: 1.1
    });
    term.open(document.getElementById("terminal"));
    const playbackTerminal = new PlaybackTerminal(term);
    playbackTerminal.start();
    window.addEventListener("message", event => {
      if (event.source !== parent) return;
      if (event.data?.type === "screen") {
        playbackTerminal.start();
        term.write(event.data.screen);
      } else if (event.data?.type === "clear-screen") {
        playbackTerminal.finish(true);
      }
    });
  </script>
</body>
</html>
